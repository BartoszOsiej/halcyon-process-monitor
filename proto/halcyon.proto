syntax = "proto3";

package halcyon.v1;

option go_package = "github.com/BartoszOsiej/halcyon-process-monitor/proto;halcyonpb";
option rust_api_module = "crate::proto";

// ── Event types ───────────────────────────────────────────────────────────

enum EventKind {
    EVENT_KIND_UNSPECIFIED = 0;
    EVENT_KIND_EXEC = 1;
    EVENT_KIND_OPEN = 2;
    EVENT_KIND_CONNECT = 3;
    EVENT_KIND_ACCEPT = 4;
    EVENT_KIND_SENDTO = 5;
    EVENT_KIND_RECVFROM = 6;
}

// ── Messages ──────────────────────────────────────────────────────────────

message ProcessEvent {
    string timestamp = 1;
    EventKind kind = 2;
    uint32 pid = 3;
    uint32 uid = 4;
    string comm = 5;
    optional string file = 6;       // File path (OPEN events)
    optional string extension = 7;  // File extension (OPEN events)
    optional string argv = 8;       // Command line (EXEC events)
    optional string remote_addr = 9; // Remote address (network events)
    optional uint64 bytes = 10;     // Bytes count (send/recv events)
}

message Alert {
    string timestamp = 1;
    uint32 pid = 2;
    uint32 uid = 3;
    string comm = 4;
    uint64 opens = 5;
}

message ProcessStats {
    uint32 pid = 1;
    uint32 ppid = 2;
    string comm = 3;
    uint64 total_opens = 4;
    uint64 total_execs = 5;
    uint64 alerts = 6;
    uint64 window_opens = 7;
    map<string, uint64> extensions = 8;
}

message FileRank {
    string path = 1;
    uint64 count = 2;
    string extension = 3;
    double entropy = 4;
}

message ExtensionCount {
    string extension = 1;
    uint64 count = 2;
}

message RateSample {
    uint64 exec_count = 1;
    uint64 open_count = 2;
    uint64 alert_count = 3;
}

message MonitorStats {
    uint64 total_events = 1;
    uint64 total_lost = 2;
    uint64 uptime_secs = 3;
    uint64 active_pids = 4;
    uint64 threshold = 5;
}

// ── RPC service ───────────────────────────────────────────────────────────

service HalcyonService {
    // Returns current monitor statistics.
    rpc GetStats(Empty) returns (MonitorStats);

    // Returns all tracked processes sorted by activity.
    rpc GetProcesses(Empty) returns (ProcessList);

    // Returns top-N most-opened files.
    rpc GetTopFiles(TopFilesRequest) returns (FileRankList);

    // Returns file extension frequency.
    rpc GetExtensions(Empty) returns (ExtensionList);

    // Returns rate history for sparklines.
    rpc GetRateHistory(Empty) returns (RateHistory);

    // Returns hierarchical process tree.
    rpc GetProcessTree(Empty) returns (ProcessTree);

    // Updates the alert threshold at runtime.
    rpc SetThreshold(SetThresholdRequest) returns (MonitorStats);

    // Stream of real-time events (server-side streaming).
    rpc WatchEvents(WatchRequest) returns (stream EventMessage);
}

// ── Request/Response types ────────────────────────────────────────────────

message Empty {}

message TopFilesRequest {
    uint32 n = 1;
}

message SetThresholdRequest {
    uint64 threshold = 1;
}

message WatchRequest {
    // Optional: filter by event kind
    repeated EventKind filter_kind = 1;
    // Optional: filter by PID
    repeated uint32 filter_pid = 2;
}

message ProcessList {
    repeated ProcessStats processes = 1;
}

message FileRankList {
    repeated FileRank files = 1;
}

message ExtensionList {
    repeated ExtensionCount extensions = 1;
}

message RateHistory {
    repeated RateSample samples = 1;
}

message ProcessTree {
    repeated TreeNode nodes = 1;
}

message TreeNode {
    uint32 depth = 1;
    uint32 pid = 2;
    uint32 ppid = 3;
    string comm = 4;
    uint64 alerts = 5;
    uint64 total_opens = 6;
}

message EventMessage {
    oneof message {
        ProcessEvent event = 1;
        Alert alert = 2;
        MonitorStats stats_update = 3;
    }
}
