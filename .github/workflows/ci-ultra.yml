name: Ultra CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ultra-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── SYNTAX ──────────────────────────────────────────────────
  fmt:
    name: fmt (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ── RUST ────────────────────────────────────────────────────
  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb  # nightly
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # ── TESTY ───────────────────────────────────────────────────
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - run: cargo test --all-features --verbose

  # ── eBPF build ──────────────────────────────────────────────
  ebpf:
    name: ebpf-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb  # nightly
        with:
          components: rust-src
      - name: Install bpf-linker (from source, matches nightly LLVM)
        run: cargo install bpf-linker --git https://github.com/alessandrod/bpf-linker --force
      - name: Fix libLLVM symlink (nightly linker scripts)
        run: |
          RUSTLIB_ROOT="$(rustc --print sysroot)"
          RUSTLIB="${RUSTLIB_ROOT}/lib"
          for f in "$RUSTLIB"/libLLVM-*-rust-*.so; do
            [ -f "$f" ] || continue
            SIZE="$(stat -c%s "$f" 2>/dev/null || echo 999999)"
            if [ "$SIZE" -lt 1024 ] 2>/dev/null; then
              REAL="$(grep -oP '(?<=INPUT\()[^)]+' "$f" 2>/dev/null || true)"
              if [ -n "$REAL" ] && [ -f "$RUSTLIB/$REAL" ]; then
                mv "$f" "${f}.script"
                ln -s "$REAL" "$f"
              fi
            fi
          done
      - name: Build eBPF (bpfel-unknown-none)
        run: |
          RUSTLIB_ROOT="$(rustc --print sysroot)"
          RUSTLIB="${RUSTLIB_ROOT}/lib"
          for f in "$RUSTLIB"/libLLVM.so.*; do
            [ -f "$f" ] || break
            LD_LIBRARY_PATH="$(dirname "$f"):$LD_LIBRARY_PATH"
            export LD_LIBRARY_PATH
            break
          done
          cargo +nightly build --profile bpf --target bpfel-unknown-none -Z build-std=core --manifest-path process-monitor-ebpf/Cargo.toml

  # ── MIRI ────────────────────────────────────────────────────
  miri:
    name: miri
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb  # nightly
        with:
          components: miri
      - run: cargo miri setup
      - run: cargo miri test
        env:
          MIRIFLAGS: "-Zmiri-ignore-leaks"

  # ── SECURITY ────────────────────────────────────────────────
  audit:
    name: cargo-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902  # v2
        with:
          command: check all

  typos:
    name: typos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: crate-ci/typos@12ffd4a04b4893ab75db66a59aaad2d996c3e982  # v1

  zizmor:
    name: zizmor (GH Actions security)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - run: pip install zizmor && zizmor .

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2.2.0

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6d786de4d6f3531a740e445b53a42b622bbbace8  # v3
        with:
          languages: rust
      - uses: github/codeql-action/analyze@6d786de4d6f3531a740e445b53a42b622bbbace8  # v3

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a  # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@6d786de4d6f3531a740e445b53a42b622bbbace8  # v3
        with:
          sarif_file: results.sarif
