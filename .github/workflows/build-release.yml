name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Log version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "Building artifacts for $TAG"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            LICENSE
            README.md
          draft: false
          prerelease: false
