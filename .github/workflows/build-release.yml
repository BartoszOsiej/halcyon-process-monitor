name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Log version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "Building artifacts for $TAG"
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.0

      - name: Sign release artifacts
        if: github.event_name != 'pull_request'
        run: |
          for f in LICENSE README.md; do
            if [ -f "$f" ]; then
              cosign sign-blob --yes --oidc-issuer https://token.actions.githubusercontent.com --output-signature "$f.sig" --output-certificate "$f.cert" "$f"
            fi
          done
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            LICENSE
            README.md
          generate_release_notes: true
          draft: false
          prerelease: false
