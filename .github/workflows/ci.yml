name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (userspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --verbose
      - name: Clippy
        run: cargo clippy -- -D warnings

  ebpf-build:
    name: Build kernel eBPF (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install bpf-linker (prebuilt)
        run: |
          curl -LsSf https://github.com/cargo-bins/cargo-binstall/releases/latest/download/cargo-binstall-x86_64-unknown-linux-gnu.tgz | tar xvzf - -C /usr/local/bin
          cargo binstall -y bpf-linker
      - name: Build eBPF (bpfel-unknown-none)
        run: cargo build -p process-monitor-ebpf -Z build-std=core,alloc --target bpfel-unknown-none --release