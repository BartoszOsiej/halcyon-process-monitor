name: build-release-assets

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install stable
      - run: cargo build --release

      - name: Generate build provenance (SLSA v1 attestation)
        id: attest
        uses: actions/attest-build-provenance@92c65d2898f1f53cfdc910b962cecff86e7f8fcc  # v1
        with:
          subject-path: |
            target/release/process-monitor
      - name: Generate SBOM (SPDX)
        run: |
          curl -sSfL "https://raw.githubusercontent.com/anchore/syft/main/install.sh" | sh -s -- -b /usr/local/bin v1.19.0
          syft scan dir:. -o spdx-json > sbom.spdx.json
      - name: Attach supply-chain artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TAG: ${{ github.ref_name }}
        run: |
          FILES="sbom.spdx.json"
          if [ -n "$BUNDLE" ] && [ -f "$BUNDLE" ]; then FILES="$FILES $BUNDLE"; fi
          # shellcheck disable=SC2086
          gh release upload "$TAG" $FILES --clobber
      - name: Attach artifacts
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            target/release/process-monitor
          generate_release_notes: true
