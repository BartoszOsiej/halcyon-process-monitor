apiVersion: v1
kind: ConfigMap
metadata:
  name: talus-ebpf-config
  namespace: observability
  labels:
    app.kubernetes.io/name: talus-ebpf-monitor
data:
  # Alert threshold: number of file opens per second per process before alerting
  TALUS_ALERT_THRESHOLD: "100"
  # Web server bind address
  TALUS_WEB_ADDR: "0.0.0.0:8080"
  # Log level (info, debug, trace)
  TALUS_LOG_LEVEL: "info"
  # Enable network syscall tracing
  TALUS_TRACE_NETWORK: "true"
  # File extension filter (empty = all)
  TALUS_FILTER_EXT: ""
