apiVersion: v1
kind: ConfigMap
metadata:
  name: halcyon-ebpf-config
  namespace: observability
  labels:
    app.kubernetes.io/name: halcyon-ebpf-monitor
data:
  # Alert threshold: number of file opens per second per process before alerting
  HALCYON_ALERT_THRESHOLD: "100"
  # Web server bind address
  HALCYON_WEB_ADDR: "0.0.0.0:8080"
  # Log level (info, debug, trace)
  HALCYON_LOG_LEVEL: "info"
  # Enable network syscall tracing
  HALCYON_TRACE_NETWORK: "true"
  # File extension filter (empty = all)
  HALCYON_FILTER_EXT: ""
