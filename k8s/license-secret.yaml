# Create the license secret from a file:
#   kubectl create secret generic talus-license \
#     --from-file=license.dat=/path/to/license.dat \
#     -n observability
#
# Or apply this template after creating the secret manually.
#
# The license.dat file should contain the JSON output of:
#   talus license export-json > license.dat
#
apiVersion: v1
kind: Secret
metadata:
  name: talus-license
  namespace: observability
  labels:
    app.kubernetes.io/name: talus-ebpf-monitor
    app.kubernetes.io/component: license
type: Opaque
# data:
#   license.dat: <base64-encoded-license-json>
#
# Example (replace with your actual license):
# data:
#   license.dat: eyJsaWNlbnNlX2lkIjoiVEFMVVMtLi4ifQ==
