[package]
repository = "https://github.com/BartoszOsiej/halcyon-process-monitor"
name = "process-monitor"
version = "0.4.0"
edition = "2021"
description = "eBPF-based real-time process and file operation monitor with TUI"
license = "MIT"

[features]
default = []  # TUI is always included, web is opt-in
web = ["dep:axum", "dep:tokio", "dep:tower-http", "dep:prometheus-client", "dep:futures", "dep:tokio-util", "dep:parking_lot"]

[dependencies]
anyhow = "1"
aya = "0.13.1"
bytes = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
colored = "2"
crossterm = "0.29.0"
libc = "0.2"
ratatui = { version = "0.30", features = ["all-widgets"] }
serde_json = "1"

# Web server (optional, enabled with --features web)
axum = { version = "0.8", features = ["ws"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower-http = { version = "0.6", features = ["cors", "fs"], optional = true }
serde = { version = "1", features = ["derive"] }
prometheus-client = { version = "0.22", optional = true }
futures = { version = "0.3", optional = true }
tokio-util = { version = "0.7", optional = true }
parking_lot = { version = "0.12", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "event_throughput"
harness = false

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
