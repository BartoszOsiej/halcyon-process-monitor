[package]
repository = "https://github.com/BartoszOsiej/halcyon-process-monitor"
name = "process-monitor"
version = "0.5.0"
edition = "2021"
description = "eBPF-based real-time process and file operation monitor with TUI"
license = "MIT"

[features]
default = []
web = ["dep:axum", "dep:tokio", "dep:tower-http", "dep:prometheus-client", "dep:futures", "dep:tokio-util", "dep:parking_lot"]
kafka = ["dep:rdkafka", "dep:tokio"]
clickhouse = ["dep:clickhouse-rs", "dep:tokio", "dep:futures"]
memgraph = ["dep:reqwest", "dep:tokio"]

[dependencies]
anyhow = "1"
aya = "0.13.1"
bytes = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
colored = "3"
crossterm = "0.29.0"
libc = "0.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
urlencoding = "2"

# FrankenTUI (path dependencies — full kernel)
ftui = { path = "../frankentui/ftui" }
ftui-core = { path = "../frankentui/ftui-core" }
ftui-render = { path = "../frankentui/ftui-render" }
ftui-runtime = { path = "../frankentui/ftui-runtime", features = ["crossterm-compat"] }
ftui-layout = { path = "../frankentui/ftui-layout" }
ftui-style = { path = "../frankentui/ftui-style" }
ftui-text = { path = "../frankentui/ftui-text" }
ftui-widgets = { path = "../frankentui/ftui-widgets" }
ftui-extras = { path = "../frankentui/ftui-extras", features = ["charts", "canvas", "text-effects"] }

# Web server (optional, enabled with --features web)
axum = { version = "0.8", features = ["ws"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower-http = { version = "0.6", features = ["cors", "fs"], optional = true }
prometheus-client = { version = "0.22", optional = true }
futures = { version = "0.3", optional = true }
tokio-util = { version = "0.7", optional = true }
parking_lot = { version = "0.12", optional = true }

# Kafka producer (optional, enabled with --features kafka)
rdkafka = { version = "0.36", features = ["cmake-build"], optional = true }

# ClickHouse storage (optional, enabled with --features clickhouse)
clickhouse-rs = { version = "1.0.0-alpha.1", optional = true }

# MemGraph client (optional, enabled with --features memgraph)
reqwest = { version = "0.12", features = ["json"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "event_throughput"
harness = false

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
