[package]
name = "process-monitor"
version = "0.2.0"
edition = "2021"
description = "eBPF-based real-time process and file operation monitor with TUI"
license = "MIT"

[dependencies]
anyhow = "1"
aya = "0.13.1"
bytes = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
colored = "2"
crossterm = "0.28.1"
libc = "0.2"
ratatui = "0.29.0"
serde_json = "1"
