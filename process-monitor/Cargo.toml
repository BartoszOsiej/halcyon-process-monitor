[package]
name = "process-monitor"
version = "0.1.0"
edition = "2021"

[dependencies]
aya = "0.13.1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
colored = "2"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = "symbols"
panic = "abort"
